<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GAME IN GAME</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#20242b;font:14px Arial,sans-serif}.top{background:#fff;padding:16px 14px 10px;position:sticky;top:0;z-index:5;border-bottom:1px solid #e7e9ed}.brand{font-size:20px;font-weight:800;letter-spacing:-.5px}.sub{color:#8b929d;font-size:11px;margin-top:3px}.search{width:100%;margin-top:12px;border:0;background:#f0f2f5;border-radius:11px;padding:12px;font-size:14px;outline:none}.tabs{display:flex;gap:7px;overflow:auto;padding:11px 12px;white-space:nowrap}.tab{border:0;border-radius:18px;padding:8px 12px;background:#fff;color:#555;font-weight:600}.tab.active{background:#20242b;color:white}.wrap{padding:0 10px 80px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.game{background:#fff;border:1px solid #e9ebef;border-radius:13px;padding:9px;min-width:0}.cover{height:76px;border-radius:10px;background:#e9edf2;display:flex;align-items:center;justify-content:center;font-size:35px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.name{font-size:12px;font-weight:700;margin:8px 0 4px;min-height:29px;line-height:1.25}.meta{font-size:10px;color:#9299a3;margin-bottom:8px}.install{width:100%;border:0;border-radius:8px;background:#e9f2ff;color:#1766c2;font-weight:700;padding:8px 3px;font-size:11px}.install:disabled{opacity:.6}.section{font-size:14px;font-weight:800;margin:4px 2px 10px}.detail{background:white;border-radius:14px;padding:14px;margin:8px 0}.detail .cover{height:150px;font-size:55px}.detail h2{font-size:19px}.detail p{color:#68717e;line-height:1.5}.detail button{font-size:14px;padding:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e7e9ed;display:flex;justify-content:space-around;padding:10px 2px calc(10px + env(safe-area-inset-bottom));font-size:10px;color:#7c8490}.bottom button{border:0;background:none;color:inherit;font-size:10px}.bottom button.active{color:#1766c2;font-weight:bold}.notice{padding:9px 12px;color:#66707d;font-size:11px}.hidden{display:none}
</style></head><body>
<header class="top"><div class="brand">GAME IN GAME</div><div class="sub">Игры в одном месте · бесплатные APK</div><input id="search" class="search" placeholder="Найти игру..." oninput="render()"></header>
<nav class="tabs"><button class="tab active" onclick="setFilter('Все',this)">Все</button><button class="tab" onclick="setFilter('Аркады',this)">Аркады</button><button class="tab" onclick="setFilter('Головоломки',this)">Головоломки</button><button class="tab" onclick="setFilter('Стратегии',this)">Стратегии</button></nav>
<main class="wrap"><div id="notice" class="notice">Каталог загружается…</div><div id="detail"></div><div id="heading" class="section">Популярные игры</div><div id="grid" class="grid"></div></main>
<footer class="bottom"><button class="active" onclick="page('Игры',this)">▦<br>Игры</button><button onclick="page('Поиск',this)">⌕<br>Поиск</button><button onclick="page('Библиотека',this)">▤<br>Библиотека</button><button onclick="page('Избранное',this)">♡<br>Избранное</button><button onclick="page('Загрузки',this)">↓<br>Загрузки</button></footer>
<script>
const API='https://game-in-game-api.onrender.com';
const fallback=[
{id:'pixel',name:'Shattered Pixel Dungeon',genre:'Аркады',icon:'⚔️',description:'Пошаговая roguelike-игра с исследованием подземелий.',url:'https://f-droid.org/repo/com.shatteredpixel.shatteredpixeldungeon_922.apk',file:'shattered-pixel-dungeon.apk'},
{id:'mindustry',name:'Mindustry',genre:'Стратегии',icon:'🏭',description:'Строй базы, производственные цепочки и защищайся от волн противников.',url:'https://f-droid.org/repo/io.anuke.mindustry_1115.apk',file:'mindustry.apk'},
{id:'unciv',name:'Unciv',genre:'Стратегии',icon:'🌍',description:'Открытая пошаговая 4X-стратегия о развитии цивилизации.',url:'https://f-droid.org/repo/com.unciv.app_1281.apk',file:'unciv.apk'},
{id:'puzzles',name:'Simon Tatham’s Puzzles',genre:'Головоломки',icon:'🧩',description:'Набор логических головоломок без рекламы.',url:'https://f-droid.org/repo/name.boyle.chris.sgtpuzzles_149.apk',file:'puzzles.apk'}
];
let games=[...fallback],filter='Все',currentPage='Игры',selected=null;
let library=JSON.parse(localStorage.getItem('gig_library')||'[]'),favorites=JSON.parse(localStorage.getItem('gig_favs')||'[]'),downloads=[];
async function loadCatalog(){try{let r=await fetch(API+'/api/games');if(r.ok){let data=await r.json();if(Array.isArray(data.games)&&data.games.length)games=data.games;document.getElementById('notice').textContent='Каталог подключён к серверу'}else throw 0}catch(e){document.getElementById('notice').textContent='Оффлайн-каталог · сервер временно недоступен'}render()}
function setFilter(v,b){filter=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function page(v,b){currentPage=v;selected=null;document.getElementById('detail').innerHTML='';document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('heading').textContent=v;render()}
function render(){let q=document.getElementById('search').value.toLowerCase();let list=games.filter(g=>(filter==='Все'||g.genre===filter)&&((g.name+' '+g.genre).toLowerCase().includes(q)));if(currentPage==='Библиотека')list=games.filter(g=>library.includes(g.id));if(currentPage==='Избранное')list=games.filter(g=>favorites.includes(g.id));if(currentPage==='Загрузки'){document.getElementById('grid').innerHTML=downloads.map(x=>'<div class="game"><div class="cover">⬇️</div><div class="name">'+x+'</div><div class="meta">Статус: '+(window.lastDownloadStatus||'ожидание')+'</div></div>').join('')||'<div class="notice">Пока нет загрузок</div>';return}
document.getElementById('grid').innerHTML=list.map(g=>'<article class="game"><div class="cover">'+(g.image?'<img src="'+esc(g.image)+'" onerror="this.remove()">':g.icon||'🎮')+'</div><div class="name">'+esc(g.name)+'</div><div class="meta">'+esc(g.genre||'Игры')+' · Бесплатно</div><button class="install" onclick="openGame(\''+g.id+'\')">Открыть</button></article>').join('')||'<div class="notice">Ничего не найдено</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openGame(id){let g=games.find(x=>x.id===id);if(!g)return;selected=g;document.getElementById('detail').innerHTML='<section class="detail"><div class="cover">'+(g.image?'<img src="'+esc(g.image)+'">':g.icon||'🎮')+'</div><h2>'+esc(g.name)+'</h2><div class="meta">'+esc(g.genre)+' · Бесплатно</div><p>'+esc(g.description)+'</p><button class="install" onclick="installGame(\''+g.id+'\')">Установить APK</button> <button class="install" onclick="toggleFav(\''+g.id+'\')">'+(favorites.includes(g.id)?'Убрать из избранного':'В избранное')+'</button></section>';window.scrollTo(0,0)}
function toggleFav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('gig_favs',JSON.stringify(favorites));if(selected)openGame(id)}
function installGame(id){let g=games.find(x=>x.id===id);if(!g||!g.url){alert('Ссылка на APK пока не добавлена');return}if(!library.includes(id)){library.push(id);localStorage.setItem('gig_library',JSON.stringify(library))}downloads.unshift(g.name);window.lastDownloadStatus='Загрузка…';if(window.Android&&Android.download){Android.download(g.url,g.file||id+'.apk')}else{alert('Установка доступна в Android-приложении GAME IN GAME')}render()}
window.downloadStarted=function(s){window.lastDownloadStatus=s;document.getElementById('notice').textContent=s;render()};
window.downloadFinished=function(s){window.lastDownloadStatus=s;document.getElementById('notice').textContent=s;render()};
window.downloadFailed=function(s){window.lastDownloadStatus=s;document.getElementById('notice').textContent=s;render()};
loadCatalog();
</script></body></html>
